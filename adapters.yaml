# Görsel modeller. Alanlar servisin model listesiyle aynı.
# skip: true olan alan bu modele gönderilmez.

models:

  gpt-image-2.5-sunburst:
    api: studio
    endpoint: /v1/images/generations
    fields:
      prompt: {to: prompt, type: string, required: true, max_length: 10000}
      aspect_ratio: {to: aspect_ratio, type: enum, values: ["16:9","4:3","1:1","3:4","9:16"], default: "16:9"}
      resolution: {to: resolution, type: enum, values: ["1K","2K","4K"], default: "1K"}
      custom_width: {to: custom_width, type: integer, min: 1, max: 4096, cap: true}
      custom_height: {to: custom_height, type: integer, min: 1, max: 4096, cap: true}
      quality: {to: quality, type: enum, values: [low, medium, high], default: medium}
      generations_count: {to: generations_count, type: integer, min: 1, max: 4, cap: true, default: 1}
      reference_images: {to: reference_images, type: array, max_items: 10}
      seed: {skip: true}
      enhance_prompt: {skip: true}

  gemini-3-pro-image:
